<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="X（Twitter）で話題の動画を、期間とジャンルから見つける VideoTrend。">
  <meta name="theme-color" content="#fdfbfc">
  <title>VideoTrend — Xの動画トレンド</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/thumbnails.webp" as="image">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#ranking">ランキングへ</a>
  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="./" aria-label="VideoTrend ホーム"><span class="brand-mark" data-icon="triangle"></span><span>Video<span>Trend</span></span></a>
      <nav aria-label="メインナビゲーション">
        <button class="nav-link active" type="button" data-view="rank" aria-current="page"><span data-icon="trend"></span>ランキング</button>
        <button class="nav-link" type="button" data-view="saved"><span data-icon="bookmark"></span>保存済み<span id="saved-count" hidden></span></button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-labelledby="headline">
      <div class="hero-copy">
        <span class="hero-tag"><span data-icon="trend"></span>Xの動画ランキング</span>
        <h1 id="headline">いま話題の動画を、<br><em>ひと目で。</em></h1>
        <p>X（旧Twitter）で注目を集める動画を、<br class="mobile-break">ランキングから見つけよう。</p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div>
        <div class="art-play"><span data-icon="triangle"></span></div>
        <span class="art-spark spark-one">✦</span><span class="art-spark spark-two">✧</span><span class="art-spark spark-three">✦</span>
        <div class="art-trend" data-icon="trend"></div>
      </div>
    </section>

    <section class="ranking" id="ranking" aria-labelledby="ranking-title">
      <div class="section-head">
        <div class="section-title"><span class="section-icon" id="heading-icon" data-icon="trend"></span><div><h2 id="ranking-title">動画ランキング</h2><p id="section-description">期間とジャンルで、気になる動画を探せます。</p></div></div>
        <div class="segments" id="periods" role="group" aria-label="ランキング期間">
          <button type="button" data-period="24" aria-pressed="true">24時間</button>
          <button type="button" data-period="72" aria-pressed="false">3日間</button>
          <button type="button" data-period="168" aria-pressed="false">1週間</button>
        </div>
      </div>
      <div class="filters">
        <div class="categories" id="categories" role="group" aria-label="ジャンル"></div>
        <label class="search"><span data-icon="search"></span><input id="search" type="search" autocomplete="off" aria-label="動画を検索" placeholder="動画を検索"></label>
      </div>
      <div class="listing-meta"><p id="results" aria-live="polite"></p><p class="demo"><span data-icon="info"></span>サンプルデータ</p></div>
      <div class="grid" id="cards"></div>
      <div class="empty" id="empty" hidden><span data-icon="search"></span><h3 id="empty-title"></h3><button class="pill" id="empty-action" type="button"></button></div>
      <noscript><p>ランキングを表示するには JavaScript を有効にしてください。</p></noscript>
      <div class="live-links"><a id="live-link" target="_blank" rel="noopener noreferrer"><span class="x-symbol" aria-hidden="true">𝕏</span>関連動画をXで探す<span data-icon="external"></span></a></div>
    </section>
  </main>
  <footer class="footer"><div class="wrap footer-inner"><a class="brand" href="./"><span class="brand-mark" data-icon="triangle"></span><span>Video<span>Trend</span></span></a><p>Xの動画を探せるランキングサイト</p></div></footer>

  <dialog id="detail" aria-labelledby="detail-title">
    <div class="detail-top"><span>サンプル投稿</span><button type="button" id="close-detail" class="icon-button" aria-label="閉じる" data-icon="close"></button></div>
    <div id="detail-image" class="thumb"></div>
    <div class="detail-copy"><span id="detail-category" class="category-tag"></span><h2 id="detail-title"></h2><p id="detail-description"></p><a class="primary-link" id="detail-link" target="_blank" rel="noopener noreferrer"><span class="x-symbol" aria-hidden="true">𝕏</span>関連動画をXで探す<span data-icon="external"></span></a></div>
  </dialog>

  <template id="video-card">
    <article class="card">
      <div class="card-media">
        <button type="button" class="thumb open-detail">
          <span class="rank-badge"></span><span class="duration"></span>
        </button>
        <button type="button" class="save-button icon-button" data-icon="bookmark"></button>
      </div>
      <div class="card-copy">
        <span class="category-tag"></span>
        <h3><button class="open-detail title-button" type="button"></button></h3>
        <p class="card-meta"><span class="views"><span data-icon="eye"></span><span></span></span><span class="posted"></span></p>
      </div>
    </article>
  </template>
</body>
</html>
